<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Streamflix — Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --red: #E50914;
      --red-dark: #b0060f;
      --dark: #141414;
      --card: #1f1f1f;
      --border: #333;
      --text: #fff;
      --muted: #b3b3b3;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Montserrat', sans-serif;
      --t: 0.3s ease;
      --navbar-h: 68px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--dark);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }

    /* ======== NAVBAR ======== */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--navbar-h);
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      transition: background 0.4s;
      background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
    }
    .navbar.scrolled { background: rgba(20,20,20,0.98) !important; }
    .navbar-left { display: flex; align-items: center; gap: 32px; }
    .logo {
      font-family: var(--font-display);
      color: var(--red);
      font-size: 1.9rem;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(229,9,20,0.5);
      flex-shrink: 0;
    }
    .nav-links { display: flex; gap: 4px; list-style: none; }
    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: color var(--t), background var(--t);
      letter-spacing: 0.3px;
      border: none;
      background: none;
      font-family: var(--font-body);
    }
    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--text); font-weight: 600; }
    .navbar-right { display: flex; align-items: center; gap: 18px; }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-input {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.4);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 7px 14px 7px 36px;
      border-radius: 3px;
      outline: none;
      width: 0; opacity: 0;
      transition: width 0.3s, opacity 0.3s;
    }
    .search-wrap.open .search-input { width: 200px; opacity: 1; }
    .search-icon { position: absolute; left: 10px; color: var(--text); cursor: pointer; z-index: 1; }
    .search-wrap:not(.open) .search-icon { position: static; }

    /* ---- PROFILE SECTION ---- */
    .profile-section {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; position: relative; user-select: none;
    }
    .profile-name-nav { font-size: 13px; font-weight: 500; color: var(--muted); }
    .profile-avatar-nav {
      width: 34px; height: 34px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; color: #fff;
      background: linear-gradient(135deg,#E50914,#b0060f);
      transition: border var(--t);
      border: 2px solid transparent;
    }
    .profile-section.active .profile-avatar-nav,
    .profile-section:hover .profile-avatar-nav { border-color: var(--text); }

    .chevron-icon {
      width: 14px; height: 14px; color: var(--muted);
      transition: transform 0.25s ease, color 0.2s;
      flex-shrink: 0;
    }
    .profile-section.active .chevron-icon { transform: rotate(180deg); color: #fff; }

    /* ---- DROPDOWN ---- */
    .profile-dropdown {
      position: absolute;
      top: calc(100% + 14px); right: 0;
      background: rgba(18,18,18,0.98);
      border: 1px solid #484848;
      border-radius: 5px;
      min-width: 210px;
      padding: 6px 0;
      z-index: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      /* Hidden by default */
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    /* Arrow tip */
    .profile-dropdown::before {
      content: '';
      position: absolute;
      top: -7px; right: 14px;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 7px solid #484848;
    }
    .profile-dropdown::after {
      content: '';
      position: absolute;
      top: -6px; right: 15px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid rgba(18,18,18,0.98);
    }
    .profile-dropdown.open {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }

    .dropdown-profile-header {
      padding: 12px 16px 10px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #383838;
      margin-bottom: 4px;
    }
    .dropdown-profile-avatar {
      width: 36px; height: 36px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .dropdown-profile-info { display: flex; flex-direction: column; }
    .dropdown-profile-name { font-size: 13px; font-weight: 600; color: #fff; }
    .dropdown-profile-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .dropdown-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 16px;
      font-size: 13px; font-weight: 500; color: var(--muted);
      cursor: pointer;
      transition: color var(--t), background var(--t);
      border: none; background: none; width: 100%;
      font-family: var(--font-body); text-align: left;
    }
    .dropdown-item:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .dropdown-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .dropdown-sep { height: 1px; background: #383838; margin: 4px 0; }

    /* ======== HERO ======== */
    .hero {
      position: relative; height: 85vh; min-height: 500px;
      display: flex; align-items: flex-end;
      padding: 0 4% 80px;
      background: #000; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center top;
      transition: opacity 0.8s ease;
    }
    .hero-grad {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(20,20,20,1) 0%, rgba(20,20,20,0.6) 40%, rgba(20,20,20,0.1) 70%, transparent 100%),
                  linear-gradient(to right, rgba(20,20,20,0.85) 0%, transparent 60%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 550px; }
    .hero-badge {
      display: inline-block; background: var(--red); color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      padding: 4px 10px; border-radius: 2px; margin-bottom: 14px; text-transform: uppercase;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 6vw, 5rem); line-height: 1; letter-spacing: 1px;
      margin-bottom: 14px; text-shadow: 2px 2px 20px rgba(0,0,0,0.8);
      transition: opacity 0.5s ease;
    }
    .hero-desc {
      font-size: 15px; font-weight: 400; color: rgba(255,255,255,0.85);
      line-height: 1.6; margin-bottom: 24px; max-width: 420px; min-height: 48px;
    }
    .hero-meta {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px; font-size: 13px; color: var(--muted);
    }
    .hero-rating { color: #46d369; font-weight: 700; }
    .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-hero {
      display: flex; align-items: center; gap: 9px;
      padding: 12px 26px; border-radius: 4px;
      font-family: var(--font-body); font-size: 15px; font-weight: 700;
      cursor: pointer; border: none; transition: all var(--t); letter-spacing: 0.3px;
    }
    .btn-hero svg { width: 20px; height: 20px; }
    .btn-play { background: #fff; color: #000; }
    .btn-play:hover { background: rgba(255,255,255,0.8); }
    .btn-info { background: rgba(109,109,110,0.7); color: #fff; }
    .btn-info:hover { background: rgba(109,109,110,0.5); }

    /* ======== SECTIONS & CAROUSELS ======== */
    .content { padding-bottom: 60px; margin-top: -40px; position: relative; z-index: 10; }
    .section { padding: 20px 0; }
    .section.hidden { display: none; }
    .section-header { display: flex; align-items: baseline; gap: 14px; padding: 0 4%; margin-bottom: 12px; }
    .section-title { font-size: 1.3rem; font-weight: 700; color: var(--text); letter-spacing: 0.3px; }
    .section-link { font-size: 12px; color: #54b3d6; font-weight: 600; letter-spacing: 1px; cursor: pointer; opacity: 0; transition: opacity var(--t); }
    .section:hover .section-link { opacity: 1; }
    .carousel-wrap { position: relative; padding: 10px 0; }
    .carousel { display: flex; gap: 6px; overflow-x: auto; padding: 10px 4%; scrollbar-width: none; scroll-behavior: smooth; }
    .carousel::-webkit-scrollbar { display: none; }
    .scroll-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 100%; background: none; border: none;
      cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity var(--t);
    }
    .scroll-btn svg { width: 28px; height: 28px; color: #fff; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8)); }
    .scroll-btn.left { left: 0; background: linear-gradient(to right, rgba(20,20,20,0.9), transparent); }
    .scroll-btn.right { right: 0; background: linear-gradient(to left, rgba(20,20,20,0.9), transparent); }
    .carousel-wrap:hover .scroll-btn { opacity: 1; }

    /* CARD */
    .card { flex: 0 0 220px; height: 124px; background-color: var(--card); border-radius: 4px; position: relative; cursor: pointer; transition: transform 0.35s ease; overflow: visible; }
    .card:hover { transform: scale(1.25); z-index: 50; }
    .card-inner { width: 100%; height: 100%; border-radius: 4px; overflow: hidden; position: relative; }
    .card-img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; background: #1a1a1a; }
    .card-badge { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 2px; letter-spacing: 1px; text-transform: uppercase; z-index: 2; }
    .card-top10 { position: absolute; top: 6px; right: 6px; background: #000; color: var(--red); font-family: var(--font-display); font-size: 10px; padding: 2px 6px; border-radius: 2px; border: 1px solid var(--red); }
    .card-hover { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 60%, transparent 100%); padding: 12px 10px 8px; opacity: 0; transition: opacity 0.2s; }
    .card:hover .card-hover { opacity: 1; }
    .card-btns { display: flex; gap: 6px; margin-bottom: 6px; }
    .card-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.8); background: rgba(20,20,20,0.8); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--t), border-color var(--t); flex-shrink: 0; }
    .card-btn:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
    .card-btn.play-btn { background: #fff; border-color: #fff; }
    .card-btn.play-btn:hover { background: rgba(255,255,255,0.8); }
    .card-btn svg { width: 14px; height: 14px; }
    .card-btn.play-btn svg { color: #000; }
    .card-title-text { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ======== SECTION PAGES ======== */
    .section-page { padding: 120px 4% 60px; display: none; }
    .section-page.visible { display: block; }
    .section-page-title { font-family: var(--font-display); font-size: 3rem; letter-spacing: 2px; margin-bottom: 8px; }
    .section-page-sub { color: var(--muted); font-size: 14px; margin-bottom: 40px; }
    .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .grid-card { aspect-ratio: 16/9; background-color: var(--card); border-radius: 4px; cursor: pointer; position: relative; overflow: hidden; transition: transform var(--t); }
    .grid-card:hover { transform: scale(1.04); z-index: 5; }
    .grid-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ======== MODAL ======== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #181818; border-radius: 8px; overflow: hidden; width: 100%; max-width: 860px; position: relative; }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; background: rgba(0,0,0,0.7); border: 1.5px solid #555; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: background var(--t); line-height: 1; font-family: var(--font-body); }
    .modal-close:hover { background: rgba(255,255,255,0.2); }
    .modal-video { width: 100%; aspect-ratio: 16/9; }
    .modal-video iframe { width: 100%; height: 100%; border: none; display: block; }
    .modal-info { padding: 20px 24px 24px; }
    .modal-title { font-family: var(--font-display); font-size: 1.8rem; letter-spacing: 1px; margin-bottom: 6px; }
    .modal-meta { font-size: 13px; color: var(--muted); display: flex; gap: 14px; margin-bottom: 10px; }
    .modal-desc { font-size: 14px; color: var(--muted); line-height: 1.6; }

    /* ======== TOAST ======== */
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: #222; border: 1px solid #555; color: #fff; font-size: 13px; font-weight: 600; padding: 12px 24px; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; z-index: 3000; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero { height: 65vh; padding-bottom: 60px; }
      .hero-title { font-size: 2.2rem; }
      .card { flex: 0 0 140px; height: 79px; }
      .grid-layout { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .profile-name-nav { display: none; }
    }
    @media (max-width: 480px) { .card { flex: 0 0 120px; height: 68px; } }
  </style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-left">
    <div class="logo">STREAMFLIX</div>
    <ul class="nav-links">
      <li><button class="nav-link active" data-view="inicio">Início</button></li>
      <li><button class="nav-link" data-view="series">Séries</button></li>
      <li><button class="nav-link" data-view="filmes">Filmes</button></li>
    </ul>
  </div>
  <div class="navbar-right">
    <div class="search-wrap" id="searchWrap">
      <svg class="search-icon" id="searchIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" id="searchInput" placeholder="Buscar..." type="text"/>
    </div>

    <!-- PROFILE TRIGGER -->
    <div class="profile-section" id="profileSection">
      <span class="profile-name-nav" id="profileName">Perfil</span>
      <div class="profile-avatar-nav" id="profileAvatar">M</div>
      <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg>

      <!-- DROPDOWN -->
      <div class="profile-dropdown" id="profileDropdown">
        <!-- Active profile header -->
        <div class="dropdown-profile-header">
          <div class="dropdown-profile-avatar" id="dropdownAvatar"></div>
          <div class="dropdown-profile-info">
            <span class="dropdown-profile-name" id="dropdownName">Perfil</span>
            <span class="dropdown-profile-sub">Perfil ativo</span>
          </div>
        </div>

        <button class="dropdown-item" id="btnTrocarPerfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Trocar perfil
        </button>
        <div class="dropdown-sep"></div>
        <button class="dropdown-item" id="btnGerenciarPerfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Gerenciar perfis
        </button>
      </div>
    </div>
  </div>
</header>

<div id="view-inicio">
  <section class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-grad"></div>
    <div class="hero-content">
      <span class="hero-badge" id="heroBadge">🔥 Em destaque</span>
      <h1 class="hero-title" id="heroTitle">Carregando...</h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-buttons">
        <button class="btn-hero btn-play" id="btnPlay">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          Assistir
        </button>
        <button class="btn-hero btn-info" id="btnInfo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Mais info
        </button>
      </div>
    </div>
  </section>

  <main class="content">
    <section class="section hidden" id="sec-mylist">
      <div class="section-header"><span class="section-title">Minha Lista</span></div>
      <div class="carousel-wrap"><div class="carousel" id="car-mylist"></div></div>
    </section>
    <section class="section" id="sec-recomendacoes">
      <div class="section-header"><span class="section-title">Recomendações para você</span><span class="section-link">Ver tudo</span></div>
      <div class="carousel-wrap">
        <button class="scroll-btn left" onclick="scrollCarousel('car-rec',-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg></button>
        <div class="carousel" id="car-rec"></div>
        <button class="scroll-btn right" onclick="scrollCarousel('car-rec',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </section>
    <section class="section" id="sec-filmes">
      <div class="section-header"><span class="section-title">Filmes em Destaque</span><span class="section-link">Ver tudo</span></div>
      <div class="carousel-wrap">
        <button class="scroll-btn left" onclick="scrollCarousel('car-filmes',-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg></button>
        <div class="carousel" id="car-filmes"></div>
        <button class="scroll-btn right" onclick="scrollCarousel('car-filmes',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </section>
    <section class="section" id="sec-series">
      <div class="section-header"><span class="section-title">Séries Populares</span><span class="section-link">Ver tudo</span></div>
      <div class="carousel-wrap">
        <button class="scroll-btn left" onclick="scrollCarousel('car-series',-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg></button>
        <div class="carousel" id="car-series"></div>
        <button class="scroll-btn right" onclick="scrollCarousel('car-series',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </section>
    <section class="section" id="sec-top10">
      <div class="section-header"><span class="section-title">Top 10 Hoje</span><span class="section-link">Ver tudo</span></div>
      <div class="carousel-wrap">
        <button class="scroll-btn left" onclick="scrollCarousel('car-top10',-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg></button>
        <div class="carousel" id="car-top10"></div>
        <button class="scroll-btn right" onclick="scrollCarousel('car-top10',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </section>
  </main>
</div>

<div id="view-series" class="section-page">
  <h1 class="section-page-title">Séries</h1>
  <p class="section-page-sub">Todas as séries disponíveis no Streamflix</p>
  <div class="grid-layout" id="grid-series"></div>
</div>

<div id="view-filmes" class="section-page">
  <h1 class="section-page-title">Filmes</h1>
  <p class="section-page-sub">Os melhores filmes para você assistir</p>
  <div class="grid-layout" id="grid-filmes"></div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-video"><iframe id="modalIframe" src="" allowfullscreen></iframe></div>
    <div class="modal-info">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMetaInfo"></div>
      <div class="modal-desc" id="modalDescInfo"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DATA
============================================================ */
const FILMES = [
  { title:'Forrest Gump', img:'https://images5.alphacoders.com/483/483981.jpg', youtube:'https://www.youtube.com/embed/bLvqoHBptjg', badge:'Clássico', rating:'98%', meta:'1994 · PG-13 · 2h 22min', desc:'Um homem de coração puro percorre décadas da história americana.' },
  { title:'Gladiador 2', img:'https://rollingstone.com.br/wp-content/uploads/gladiador_2_com_paul_mescal_e_pedro_pascal_estreia_nos_cinemas_brasileiros.jpg', youtube:'https://www.youtube.com/embed/cXg62-t8BWs', badge:'Novo', rating:'94%', meta:'2024 · R · 2h 28min', desc:'O legado de Máximo continua em Roma com um novo guerreiro.' },
  { title:'Duna: Parte 2', img:'https://4kwallpapers.com/images/wallpapers/dune-part-two-movie-7680x4320-15307.jpg', youtube:'https://www.youtube.com/embed/Way9Dexny3w', top10:true, rating:'96%', meta:'2024 · PG-13 · 2h 46min', desc:'Paul Atreides une-se a Chani e os Fremen para uma guerra épica.' },
  { title:'Oppenheimer', img:'https://image.tmdb.org/t/p/original/rLb2cwF3Pazuxaj0sRXQ037tGI1.jpg', youtube:'https://www.youtube.com/embed/uYPbbksJxIg', top10:true, meta:'2023 · R · 3h', desc:'A história do físico que liderou o projeto da bomba atômica.' },
  { title:'Poor Things', img:'https://wallpaperaccess.com/full/11832913.jpg', youtube:'https://www.youtube.com/embed/RlbR5N6veqw', badge:'Oscar', meta:'2023 · R · 2h 21min', desc:'Uma jovem ressuscitada descobre o mundo sem preconceitos.' },
  { title:'Avatar 2', img:'https://w0.peakpx.com/wallpaper/965/851/HD-wallpaper-avatar-2-2018-poster-fantasy-movie-avatar-2-navi-blue.jpg', youtube:'https://www.youtube.com/embed/a8Gx8wiNbs8', meta:'2022 · PG-13 · 3h 12min', desc:'A família Sully explora as maravilhas aquáticas de Pandora.' },
  { title:'Top Gun: Maverick', img:'https://4kwallpapers.com/images/wallpapers/top-gun-maverick-tom-cruise-capt-pete-maverick-mitchell-3840x2160-8210.jpg', youtube:'https://www.youtube.com/embed/qSqVVswa420', top10:true, meta:'2022 · PG-13 · 2h 10min', desc:'Maverick volta ao serviço ativo treinando a nova geração.' },
  { title:'The Batman', img:'https://image.tmdb.org/t/p/original/74xTEgt7R36Fpooo50r9T25onhq.jpg', youtube:'https://www.youtube.com/embed/mqqft2x_Aa4', badge:'DC', meta:'2022 · PG-13 · 2h 56min', desc:'Batman enfrenta o Charada em uma Gotham mergulhada em corrupção.' }
];
const SERIES = [
  { title:'Breaking Bad', img:'https://images4.alphacoders.com/131/1315826.jpg', youtube:'https://www.youtube.com/embed/HhesaQXLuRY', top10:true, rating:'99%', meta:'2008–2013 · 5 Temporadas', desc:'Um professor de química vira um fabricante de metanfetamina.' },
  { title:'Stranger Things', img:'https://4kwallpapers.com/images/wallpapers/stranger-things-1920x1080-25038.jpg', youtube:'https://www.youtube.com/embed/b9EkMc79ZSU', badge:'Nova Temp', meta:'2016– · 4 Temporadas', desc:'Crianças descobrem forças sobrenaturais em sua cidade.' },
  { title:'The Last of Us', img:'https://cdn.observatoriodocinema.com.br/2025/03/Screenshot-10.png', youtube:'https://www.youtube.com/embed/uLtkt8BonwM', top10:true, rating:'97%', meta:'2023– · 2 Temporadas', desc:'Um sobrevivente e uma imune atravessam os EUA pós-apocalíptico.' },
  { title:'House of Dragon', img:'https://image.tmdb.org/t/p/original/z2yahl2uefxDCl0nogcRBstwruJ.jpg', youtube:'https://www.youtube.com/embed/DotnJ7tTA34', badge:'HBO', meta:'2022– · 2 Temporadas', desc:'A queda da casa Targaryen 200 anos antes de Game of Thrones.' },
  { title:'Succession', img:'https://images6.alphacoders.com/112/1120696.jpg', youtube:'https://www.youtube.com/embed/OqMFCATfuSk', badge:'Emmy', rating:'95%', meta:'2018–2023 · 4 Temporadas', desc:'A batalha pelo controle de um império de mídia.' },
  { title:'Wednesday', img:'https://image.tmdb.org/t/p/original/9PFonBhy4cQy7Jz20NpMygczOkv.jpg', youtube:'https://www.youtube.com/embed/Di310WS8zLk', badge:'Novo', meta:'2022– · 2 Temporadas', desc:'Wednesday Addams investiga crimes sobrenaturais.' },
  { title:'The Crown', img:'https://myhotposters.com/cdn/shop/products/mL0838_53db24a1-4d41-40dc-bab0-1591d8cd0773_1024x1024.jpg?v=1748536618', youtube:'https://www.youtube.com/embed/JWtnJjn6ng0', meta:'2016–2023 · 6 Temporadas', desc:'A história do reinado da Rainha Elizabeth II.' },
  { title:'Chernobyl', img:'https://images5.alphacoders.com/132/thumb-1920-1321570.jpeg', youtube:'https://www.youtube.com/embed/s9APLXM9Ei8', top10:true, meta:'2019 · Minissérie · HBO', desc:'O maior desastre nuclear da história.' }
];

/* ============================================================
   HERO ROTATIVO
============================================================ */
const FEATURES = [FILMES[0], SERIES[2], FILMES[2], SERIES[4], FILMES[1], SERIES[0]];
let featureIndex = 0;
function updateHero(index) {
  const f = FEATURES[index];
  const heroTitle = document.getElementById('heroTitle');
  const heroDesc  = document.getElementById('heroDesc');
  heroTitle.style.opacity = '0'; heroDesc.style.opacity = '0';
  setTimeout(() => {
    document.getElementById('heroBg').style.backgroundImage = `url("${f.img}")`;
    heroTitle.textContent = f.title;
    heroDesc.textContent  = f.desc;
    document.getElementById('heroBadge').textContent = f.badge ? `🔥 ${f.badge}` : '🔥 Em destaque';
    document.getElementById('heroMeta').innerHTML =
      (f.rating ? `<span class="hero-rating">${f.rating} relevante</span>` : '') +
      f.meta.split(' · ').map(m => `<span>${m}</span>`).join('');
    document.getElementById('btnPlay').onclick = () => openModal(f.youtube, f.title, f.meta, f.desc);
    document.getElementById('btnInfo').onclick = () => openModal(f.youtube, f.title, f.meta, f.desc);
    heroTitle.style.opacity = '1'; heroDesc.style.opacity = '1';
  }, 300);
}
updateHero(featureIndex);
setInterval(() => { featureIndex = (featureIndex + 1) % FEATURES.length; updateHero(featureIndex); }, 7000);

/* ============================================================
   PERFIL ATIVO — lê do localStorage (gravado pelo profiles.html)
============================================================ */
function getActiveProfile() {
  const profiles = JSON.parse(localStorage.getItem('sf_profiles') || '[]');
  const activeId  = localStorage.getItem('sf_activeProfileId');
  return profiles.find(p => p.id === activeId) || profiles[0] || null;
}

function refreshNavbarProfile() {
  const p = getActiveProfile();
  if (!p) return;

  const name   = p.name || 'Perfil';
  const letter = p.icon  || (name[0] || 'P').toUpperCase();
  const bg     = p.bg    ? `linear-gradient(135deg,${p.bg[0]},${p.bg[1]})` : 'linear-gradient(135deg,#E50914,#b0060f)';

  document.getElementById('profileName').textContent  = name;
  document.getElementById('profileAvatar').textContent = letter;
  document.getElementById('profileAvatar').style.background = bg;

  // Dropdown header
  const da = document.getElementById('dropdownAvatar');
  da.textContent = letter;
  da.style.background = bg;
  document.getElementById('dropdownName').textContent = name;
}
refreshNavbarProfile();

/* ============================================================
   DROPDOWN — baseado em CLIQUE (não hover CSS)
============================================================ */
const profileSection = document.getElementById('profileSection');
const profileDropdown = document.getElementById('profileDropdown');

profileSection.addEventListener('click', (e) => {
  // Não toggle se clicou num botão dentro do dropdown
  if (e.target.closest('#profileDropdown') && !e.target.closest('.dropdown-item')) return;
  const isOpen = profileDropdown.classList.contains('open');
  if (!isOpen) {
    profileDropdown.classList.add('open');
    profileSection.classList.add('active');
  }
});

// Fechar ao clicar fora
document.addEventListener('click', (e) => {
  if (!profileSection.contains(e.target)) {
    profileDropdown.classList.remove('open');
    profileSection.classList.remove('active');
  }
});

// Trocar perfil → profiles.html (tela "Quem está assistindo?")
document.getElementById('btnTrocarPerfil').addEventListener('click', () => {
  window.location.href = 'index.html';
});

// Gerenciar perfis → profiles.html?manage=true (abre direto na tela de gerenciar)
document.getElementById('btnGerenciarPerfil').addEventListener('click', () => {
  window.location.href = 'index.html?manage=true';
});

/* ============================================================
   NAVBAR SCROLL & NAVEGAÇÃO
============================================================ */
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
});
function setView(view) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.view === view));
  document.getElementById('view-inicio').style.display = view === 'inicio' ? 'block' : 'none';
  document.getElementById('view-series').classList.toggle('visible', view === 'series');
  document.getElementById('view-filmes').classList.toggle('visible', view === 'filmes');
  window.scrollTo({ top: 0, behavior: view === 'inicio' ? 'smooth' : 'instant' });
}
document.querySelectorAll('.nav-link').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));

/* ============================================================
   SEARCH
============================================================ */
document.getElementById('searchIcon').addEventListener('click', () => {
  const wrap = document.getElementById('searchWrap');
  wrap.classList.toggle('open');
  if (wrap.classList.contains('open')) document.getElementById('searchInput').focus();
});

/* ============================================================
   CAROUSEL
============================================================ */
function scrollCarousel(id, dir) {
  document.getElementById(id).scrollBy({ left: dir * 600, behavior: 'smooth' });
}

/* ============================================================
   MYLIST
============================================================ */
const myList = new Set(JSON.parse(localStorage.getItem('sf_mylist') || '[]'));
function saveList() { localStorage.setItem('sf_mylist', JSON.stringify([...myList])); }

/* ============================================================
   CARDS
============================================================ */
function makeCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  const inner = document.createElement('div');
  inner.className = 'card-inner';
  const img = document.createElement('img');
  img.className = 'card-img'; img.src = item.img; img.alt = item.title;
  img.onerror = () => { img.src = 'https://via.placeholder.com/500x281/1a1a1a/fff?text=' + encodeURIComponent(item.title); };
  inner.appendChild(img);
  if (item.badge) { const b = document.createElement('div'); b.className='card-badge'; b.textContent=item.badge; inner.appendChild(b); }
  if (item.top10) { const t = document.createElement('div'); t.className='card-top10'; t.textContent='TOP 10'; inner.appendChild(t); }

  const hover = document.createElement('div'); hover.className = 'card-hover';
  const btns  = document.createElement('div'); btns.className  = 'card-btns';

  const playBtn = document.createElement('button'); playBtn.className = 'card-btn play-btn';
  playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>';
  playBtn.onclick = (e) => { e.stopPropagation(); openModal(item.youtube, item.title, item.meta, item.desc); };

  const getIcon = (on) => on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';

  const addBtn = document.createElement('button'); addBtn.className = 'card-btn';
  addBtn.innerHTML = getIcon(myList.has(item.title));
  addBtn.onclick = (e) => {
    e.stopPropagation();
    myList.has(item.title) ? (myList.delete(item.title), showToast('Removido da Minha Lista')) : (myList.add(item.title), showToast('Adicionado à Minha Lista'));
    saveList(); addBtn.innerHTML = getIcon(myList.has(item.title)); renderMyList();
  };
  btns.appendChild(playBtn); btns.appendChild(addBtn);
  const titleTxt = document.createElement('div'); titleTxt.className='card-title-text'; titleTxt.textContent=item.title;
  hover.appendChild(btns); hover.appendChild(titleTxt);
  inner.appendChild(hover); card.appendChild(inner);
  card.onclick = () => openModal(item.youtube, item.title, item.meta, item.desc);
  return card;
}

function renderMyList() {
  const c = document.getElementById('car-mylist'), s = document.getElementById('sec-mylist');
  c.innerHTML = ''; let n = 0;
  [...FILMES,...SERIES].forEach(i => { if (myList.has(i.title)) { c.appendChild(makeCard(i)); n++; } });
  s.classList.toggle('hidden', n === 0);
}

function renderAll() {
  FILMES.forEach(i => document.getElementById('car-filmes').appendChild(makeCard(i)));
  SERIES.forEach(i => document.getElementById('car-series').appendChild(makeCard(i)));
  [...FILMES,...SERIES].filter(i=>i.top10).forEach(i => document.getElementById('car-top10').appendChild(makeCard(i)));
  [...SERIES,...FILMES].sort(()=>0.5-Math.random()).slice(0,10).forEach(i => document.getElementById('car-rec').appendChild(makeCard(i)));
  FILMES.forEach(i => { const c=makeCard(i); c.className='grid-card'; document.getElementById('grid-filmes').appendChild(c); });
  SERIES.forEach(i => { const c=makeCard(i); c.className='grid-card'; document.getElementById('grid-series').appendChild(c); });
  renderMyList();
}

/* ============================================================
   MODAL & TOAST
============================================================ */
function openModal(url, title, meta, desc) {
  document.getElementById('modalIframe').src = url + '?autoplay=1';
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMetaInfo').innerHTML = meta.split(' · ').map(m=>`<span>${m}</span>`).join('');
  document.getElementById('modalDescInfo').textContent = desc;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('modalIframe').src=''; document.body.style.overflow=''; }
function closeModalOutside(e) { if (e.target===document.getElementById('modal')) closeModal(); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

renderAll();
</script>
</body>
</html>
