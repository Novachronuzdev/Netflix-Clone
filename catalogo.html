<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Streamflix — Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="catalogo.css"/>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="navbar-left">
    <div class="logo">STREAMFLIX</div>
    <ul class="nav-links">
      <li><button class="nav-link active" data-view="inicio">Início</button></li>
      <li><button class="nav-link" data-view="series">Séries</button></li>
      <li><button class="nav-link" data-view="filmes">Filmes</button></li>
    </ul>
  </div>
  <div class="navbar-right">
    <div class="search-wrap" id="searchWrap">
      <svg class="search-icon" id="searchIcon" aria-label="Buscar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" id="searchInput" placeholder="Buscar..." type="text"/>
    </div>

    <!-- PROFILE TRIGGER -->
    <div class="profile-section" id="profileSection">
      <span class="profile-name-nav" id="profileName">Perfil</span>
      <div class="profile-avatar-nav" id="profileAvatar">M</div>
      <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg>

      <!-- DROPDOWN -->
      <div class="profile-dropdown" id="profileDropdown">
        <!-- Active profile header -->
        <div class="dropdown-profile-header">
          <div class="dropdown-profile-avatar" id="dropdownAvatar"></div>
          <div class="dropdown-profile-info">
            <span class="dropdown-profile-name" id="dropdownName">Perfil</span>
            <span class="dropdown-profile-sub">Perfil ativo</span>
          </div>
        </div>

        <button class="dropdown-item" id="btnTrocarPerfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Trocar perfil
        </button>
        <div class="dropdown-sep"></div>
        <button class="dropdown-item" id="btnGerenciarPerfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Gerenciar perfis
        </button>
      </div>
    </div>
  </div>
</header>

<div id="view-inicio">
  <section class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-grad"></div>
    <div class="hero-content">
      <span class="hero-badge" id="heroBadge">🔥 Em destaque</span>
      <h1 class="hero-title" id="heroTitle">Carregando...</h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-buttons">
        <button class="btn-hero btn-play" id="btnPlay">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          Assistir
        </button>
        <button class="btn-hero btn-info" id="btnInfo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Mais info
        </button>
      </div>
    </div>
  </section>

  <main class="content">
    <section class="section hidden" id="sec-mylist">
      <div class="section-header"><span class="section-title">Minha Lista</span></div>
      <div class="carousel-wrap"><div class="carousel" id="car-mylist"></div></div>
    </section>
    <section class="section" id="sec-recomendacoes">
      <div class="section-header"><span class="section-title">Recomendações para você</span><span class="section-link">Ver tudo</span></div>
      <div class="carousel-wrap">
        <button class="scroll-btn left" aria-label="Rolar para esquerda" onclick="scrollCarousel('car-rec',-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg></button>
        <div class="carousel" id="car-rec"></div>
        <button class="scroll-btn right" aria-label="Rolar para direita" onclick="scrollCarousel('car-rec',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </section>
    <section class="section" id="sec-filmes">
      <div class="section-header"><span class="section-title">Filmes em Destaque</span><span class="section-link">Ver tudo</span></div>
      <div class="carousel-wrap">
        <button class="scroll-btn left" aria-label="Rolar para esquerda" onclick="scrollCarousel('car-filmes',-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg></button>
        <div class="carousel" id="car-filmes"></div>
        <button class="scroll-btn right" aria-label="Rolar para direita" onclick="scrollCarousel('car-filmes',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </section>
    <section class="section" id="sec-series">
      <div class="section-header"><span class="section-title">Séries Populares</span><span class="section-link">Ver tudo</span></div>
      <div class="carousel-wrap">
        <button class="scroll-btn left" aria-label="Rolar para esquerda" onclick="scrollCarousel('car-series',-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg></button>
        <div class="carousel" id="car-series"></div>
        <button class="scroll-btn right" aria-label="Rolar para direita" onclick="scrollCarousel('car-series',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </section>
    <section class="section" id="sec-top10">
      <div class="section-header"><span class="section-title">Top 10 Hoje</span><span class="section-link">Ver tudo</span></div>
      <div class="carousel-wrap">
        <button class="scroll-btn left" aria-label="Rolar para esquerda" onclick="scrollCarousel('car-top10',-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg></button>
        <div class="carousel" id="car-top10"></div>
        <button class="scroll-btn right" aria-label="Rolar para direita" onclick="scrollCarousel('car-top10',1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </section>
  </main>
</div>

<div id="view-series" class="section-page">
  <h1 class="section-page-title">Séries</h1>
  <p class="section-page-sub">Todas as séries disponíveis no Streamflix</p>
  <div class="grid-layout" id="grid-series"></div>
</div>

<div id="view-filmes" class="section-page">
  <h1 class="section-page-title">Filmes</h1>
  <p class="section-page-sub">Os melhores filmes para você assistir</p>
  <div class="grid-layout" id="grid-filmes"></div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <button class="modal-close" aria-label="Fechar" onclick="closeModal()">✕</button>
    <div class="modal-video"><iframe id="modalIframe" src="" allowfullscreen></iframe></div>
    <div class="modal-info">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMetaInfo"></div>
      <div class="modal-desc" id="modalDescInfo"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DATA
============================================================ */
const FILMES = [
  { title:'Forrest Gump', img:'https://images5.alphacoders.com/483/483981.jpg', youtube:'https://www.youtube.com/embed/bLvqoHBptjg', badge:'Clássico', rating:'98%', meta:'1994 · PG-13 · 2h 22min', desc:'Um homem de coração puro percorre décadas da história americana.' },
  { title:'Gladiador 2', img:'https://rollingstone.com.br/wp-content/uploads/gladiador_2_com_paul_mescal_e_pedro_pascal_estreia_nos_cinemas_brasileiros.jpg', youtube:'https://www.youtube.com/embed/cXg62-t8BWs', badge:'Novo', rating:'94%', meta:'2024 · R · 2h 28min', desc:'O legado de Máximo continua em Roma com um novo guerreiro.' },
  { title:'Duna: Parte 2', img:'https://4kwallpapers.com/images/wallpapers/dune-part-two-movie-7680x4320-15307.jpg', youtube:'https://www.youtube.com/embed/Way9Dexny3w', top10:true, rating:'96%', meta:'2024 · PG-13 · 2h 46min', desc:'Paul Atreides une-se a Chani e os Fremen para uma guerra épica.' },
  { title:'Oppenheimer', img:'https://image.tmdb.org/t/p/original/rLb2cwF3Pazuxaj0sRXQ037tGI1.jpg', youtube:'https://www.youtube.com/embed/uYPbbksJxIg', top10:true, meta:'2023 · R · 3h', desc:'A história do físico que liderou o projeto da bomba atômica.' },
  { title:'Poor Things', img:'https://wallpaperaccess.com/full/11832913.jpg', youtube:'https://www.youtube.com/embed/RlbR5N6veqw', badge:'Oscar', meta:'2023 · R · 2h 21min', desc:'Uma jovem ressuscitada descobre o mundo sem preconceitos.' },
  { title:'Avatar 2', img:'https://images.squarespace-cdn.com/content/v1/61e8957e6207ab288c880875/4925b61f-422b-48ac-b3f1-ed6b80b7c152/Screen+Shot+2023-04-14+at+1.42.58+PM.png', youtube:'https://www.youtube.com/embed/a8Gx8wiNbs8', meta:'2022 · PG-13 · 3h 12min', desc:'A família Sully explora as maravilhas aquáticas de Pandora.' },
  { title:'Top Gun: Maverick', img:'https://4kwallpapers.com/images/wallpapers/top-gun-maverick-tom-cruise-capt-pete-maverick-mitchell-3840x2160-8210.jpg', youtube:'https://www.youtube.com/embed/qSqVVswa420', top10:true, meta:'2022 · PG-13 · 2h 10min', desc:'Maverick volta ao serviço ativo treinando a nova geração.' },
  { title:'The Batman', img:'https://image.tmdb.org/t/p/original/74xTEgt7R36Fpooo50r9T25onhq.jpg', youtube:'https://www.youtube.com/embed/mqqft2x_Aa4', badge:'DC', meta:'2022 · PG-13 · 2h 56min', desc:'Batman enfrenta o Charada em uma Gotham mergulhada em corrupção.' }
];
const SERIES = [
  { title:'Breaking Bad', img:'https://images4.alphacoders.com/131/1315826.jpg', youtube:'https://www.youtube.com/embed/HhesaQXLuRY', top10:true, rating:'99%', meta:'2008–2013 · 5 Temporadas', desc:'Um professor de química vira um fabricante de metanfetamina.' },
  { title:'Stranger Things', img:'https://4kwallpapers.com/images/wallpapers/stranger-things-1920x1080-25038.jpg', youtube:'https://www.youtube.com/embed/b9EkMc79ZSU', badge:'Nova Temp', meta:'2016– · 4 Temporadas', desc:'Crianças descobrem forças sobrenaturais em sua cidade.' },
  { title:'The Last of Us', img:'https://cdn.observatoriodocinema.com.br/2025/03/Screenshot-10.png', youtube:'https://www.youtube.com/embed/uLtkt8BonwM', top10:true, rating:'97%', meta:'2023– · 2 Temporadas', desc:'Um sobrevivente e uma imune atravessam os EUA pós-apocalíptico.' },
  { title:'House of Dragon', img:'https://image.tmdb.org/t/p/original/z2yahl2uefxDCl0nogcRBstwruJ.jpg', youtube:'https://www.youtube.com/embed/DotnJ7tTA34', badge:'HBO', meta:'2022– · 2 Temporadas', desc:'A queda da casa Targaryen 200 anos antes de Game of Thrones.' },
  { title:'Succession', img:'https://images6.alphacoders.com/112/1120696.jpg', youtube:'https://www.youtube.com/embed/OqMFCATfuSk', badge:'Emmy', rating:'95%', meta:'2018–2023 · 4 Temporadas', desc:'A batalha pelo controle de um império de mídia.' },
  { title:'Wednesday', img:'https://image.tmdb.org/t/p/original/9PFonBhy4cQy7Jz20NpMygczOkv.jpg', youtube:'https://www.youtube.com/embed/Di310WS8zLk', badge:'Novo', meta:'2022– · 2 Temporadas', desc:'Wednesday Addams investiga crimes sobrenaturais.' },
  { title:'The Crown', img:'https://myhotposters.com/cdn/shop/products/mL0838_53db24a1-4d41-40dc-bab0-1591d8cd0773_1024x1024.jpg?v=1748536618', youtube:'https://www.youtube.com/embed/JWtnJjn6ng0', meta:'2016–2023 · 6 Temporadas', desc:'A história do reinado da Rainha Elizabeth II.' },
  { title:'Chernobyl', img:'https://images5.alphacoders.com/132/thumb-1920-1321570.jpeg', youtube:'https://www.youtube.com/embed/s9APLXM9Ei8', top10:true, meta:'2019 · Minissérie · HBO', desc:'O maior desastre nuclear da história.' }
];

/* ============================================================
   HERO ROTATIVO
============================================================ */
const FEATURES = [FILMES[0], SERIES[2], FILMES[2], SERIES[4], FILMES[1], SERIES[0]];
let featureIndex = 0;
function updateHero(index) {
  const f = FEATURES[index];
  const heroTitle = document.getElementById('heroTitle');
  const heroDesc  = document.getElementById('heroDesc');
  heroTitle.style.opacity = '0'; heroDesc.style.opacity = '0';
  setTimeout(() => {
    document.getElementById('heroBg').style.backgroundImage = `url("${f.img}")`;
    heroTitle.textContent = f.title;
    heroDesc.textContent  = f.desc;
    document.getElementById('heroBadge').textContent = f.badge ? `🔥 ${f.badge}` : '🔥 Em destaque';
    document.getElementById('heroMeta').innerHTML =
      (f.rating ? `<span class="hero-rating">${f.rating} relevante</span>` : '') +
      f.meta.split(' · ').map(m => `<span>${m}</span>`).join('');
    document.getElementById('btnPlay').onclick = () => openModal(f.youtube, f.title, f.meta, f.desc);
    document.getElementById('btnInfo').onclick = () => openModal(f.youtube, f.title, f.meta, f.desc);
    heroTitle.style.opacity = '1'; heroDesc.style.opacity = '1';
  }, 300);
}
updateHero(featureIndex);

let heroInterval;
function startHeroInterval() {
  heroInterval = setInterval(() => { 
    featureIndex = (featureIndex + 1) % FEATURES.length; 
    updateHero(featureIndex); 
  }, 7000);
}

startHeroInterval();

// Pausa o intervalo se a aba do navegador estiver invisível
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearInterval(heroInterval);
  } else {
    startHeroInterval();
  }
});

/* ============================================================
   PERFIL ATIVO — lê do localStorage (gravado pelo profiles.html)
============================================================ */
function getActiveProfile() {
  const profiles = JSON.parse(localStorage.getItem('sf_profiles') || '[]');
  const activeId  = localStorage.getItem('sf_activeProfileId');
  return profiles.find(p => p.id === activeId) || profiles[0] || null;
}

function refreshNavbarProfile() {
  const p = getActiveProfile();
  if (!p) return;

  const name   = p.name || 'Perfil';
  const letter = p.icon  || (name[0] || 'P').toUpperCase();
  const bg     = p.bg    ? `linear-gradient(135deg,${p.bg[0]},${p.bg[1]})` : 'linear-gradient(135deg,#E50914,#b0060f)';

  document.getElementById('profileName').textContent  = name;
  document.getElementById('profileAvatar').textContent = letter;
  document.getElementById('profileAvatar').style.background = bg;

  // Dropdown header
  const da = document.getElementById('dropdownAvatar');
  da.textContent = letter;
  da.style.background = bg;
  document.getElementById('dropdownName').textContent = name;
}
refreshNavbarProfile();

/* ============================================================
   DROPDOWN — baseado em CLIQUE (não hover CSS)
============================================================ */
const profileSection = document.getElementById('profileSection');
const profileDropdown = document.getElementById('profileDropdown');

profileSection.addEventListener('click', (e) => {
  // Não toggle se clicou num botão dentro do dropdown
  if (e.target.closest('#profileDropdown') && !e.target.closest('.dropdown-item')) return;
  const isOpen = profileDropdown.classList.contains('open');
  if (!isOpen) {
    profileDropdown.classList.add('open');
    profileSection.classList.add('active');
  }
});

// Fechar ao clicar fora
document.addEventListener('click', (e) => {
  if (!profileSection.contains(e.target)) {
    profileDropdown.classList.remove('open');
    profileSection.classList.remove('active');
  }
});

// Trocar perfil → index.html (tela "Quem está assistindo?")
document.getElementById('btnTrocarPerfil').addEventListener('click', () => {
  window.location.href = 'index.html';
});

// Gerenciar perfis → index.html?manage=true (abre direto na tela de gerenciar)
document.getElementById('btnGerenciarPerfil').addEventListener('click', () => {
  window.location.href = 'index.html?manage=true';
});

/* ============================================================
   NAVBAR SCROLL & NAVEGAÇÃO
============================================================ */
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
});
function setView(view) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.view === view));
  document.getElementById('view-inicio').style.display = view === 'inicio' ? 'block' : 'none';
  document.getElementById('view-series').classList.toggle('visible', view === 'series');
  document.getElementById('view-filmes').classList.toggle('visible', view === 'filmes');
  window.scrollTo({ top: 0, behavior: view === 'inicio' ? 'smooth' : 'instant' });
}
document.querySelectorAll('.nav-link').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));

/* ============================================================
   SEARCH
============================================================ */
document.getElementById('searchIcon').addEventListener('click', () => {
  const wrap = document.getElementById('searchWrap');
  wrap.classList.toggle('open');
  if (wrap.classList.contains('open')) document.getElementById('searchInput').focus();
});

// FILTRO DE BUSCA (MODIFICADO)
document.getElementById('searchInput').addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase().trim();
  const allCards = document.querySelectorAll('.card');
  
  allCards.forEach(card => {
    // Busca o texto do título do card para comparar
    const titleText = card.querySelector('.card-title-text');
    if(titleText) {
      const title = titleText.textContent.toLowerCase();
      // Oculta ou mostra baseado no termo da busca
      card.style.display = title.includes(term) ? '' : 'none';
    }
  });
});

/* ============================================================
   CAROUSEL
============================================================ */
function scrollCarousel(id, dir) {
  document.getElementById(id).scrollBy({ left: dir * 600, behavior: 'smooth' });
}

/* ============================================================
   MYLIST
============================================================ */
const myList = new Set(JSON.parse(localStorage.getItem('sf_mylist') || '[]'));
function saveList() { localStorage.setItem('sf_mylist', JSON.stringify([...myList])); }

/* ============================================================
   CARDS
============================================================ */
function makeCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  const inner = document.createElement('div');
  inner.className = 'card-inner';
  const img = document.createElement('img');
  img.className = 'card-img'; img.src = item.img; img.alt = item.title;
  img.onerror = () => { img.src = 'https://via.placeholder.com/500x281/1a1a1a/fff?text=' + encodeURIComponent(item.title); };
  inner.appendChild(img);
  if (item.badge) { const b = document.createElement('div'); b.className='card-badge'; b.textContent=item.badge; inner.appendChild(b); }
  if (item.top10) { const t = document.createElement('div'); t.className='card-top10'; t.textContent='TOP 10'; inner.appendChild(t); }

  const hover = document.createElement('div'); hover.className = 'card-hover';
  const btns  = document.createElement('div'); btns.className  = 'card-btns';

  const playBtn = document.createElement('button'); playBtn.className = 'card-btn play-btn';
  playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>';
  playBtn.onclick = (e) => { e.stopPropagation(); openModal(item.youtube, item.title, item.meta, item.desc); };

  const getIcon = (on) => on
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';

  const addBtn = document.createElement('button'); addBtn.className = 'card-btn';
  addBtn.innerHTML = getIcon(myList.has(item.title));
  addBtn.onclick = (e) => {
    e.stopPropagation();
    myList.has(item.title) ? (myList.delete(item.title), showToast('Removido da Minha Lista')) : (myList.add(item.title), showToast('Adicionado à Minha Lista'));
    saveList(); addBtn.innerHTML = getIcon(myList.has(item.title)); renderMyList();
  };
  btns.appendChild(playBtn); btns.appendChild(addBtn);
  const titleTxt = document.createElement('div'); titleTxt.className='card-title-text'; titleTxt.textContent=item.title;
  hover.appendChild(btns); hover.appendChild(titleTxt);
  inner.appendChild(hover); card.appendChild(inner);
  card.onclick = () => openModal(item.youtube, item.title, item.meta, item.desc);
  return card;
}

function renderMyList() {
  const c = document.getElementById('car-mylist'), s = document.getElementById('sec-mylist');
  c.innerHTML = ''; let n = 0;
  [...FILMES,...SERIES].forEach(i => { if (myList.has(i.title)) { c.appendChild(makeCard(i)); n++; } });
  s.classList.toggle('hidden', n === 0);
}

// PERFORMANCE (MODIFICADO COM DOCUMENT FRAGMENT)
function renderAll() {
  const fragFilmes = document.createDocumentFragment();
  FILMES.forEach(i => fragFilmes.appendChild(makeCard(i)));
  document.getElementById('car-filmes').appendChild(fragFilmes);

  const fragSeries = document.createDocumentFragment();
  SERIES.forEach(i => fragSeries.appendChild(makeCard(i)));
  document.getElementById('car-series').appendChild(fragSeries);

  const fragTop10 = document.createDocumentFragment();
  [...FILMES,...SERIES].filter(i=>i.top10).forEach(i => fragTop10.appendChild(makeCard(i)));
  document.getElementById('car-top10').appendChild(fragTop10);

  const fragRec = document.createDocumentFragment();
  [...SERIES,...FILMES].sort(()=>0.5-Math.random()).slice(0,10).forEach(i => fragRec.appendChild(makeCard(i)));
  document.getElementById('car-rec').appendChild(fragRec);

  const fragGridFilmes = document.createDocumentFragment();
  FILMES.forEach(i => { const c=makeCard(i); c.className='grid-card card'; fragGridFilmes.appendChild(c); });
  document.getElementById('grid-filmes').appendChild(fragGridFilmes);

  const fragGridSeries = document.createDocumentFragment();
  SERIES.forEach(i => { const c=makeCard(i); c.className='grid-card card'; fragGridSeries.appendChild(c); });
  document.getElementById('grid-series').appendChild(fragGridSeries);

  renderMyList();
}

/* ============================================================
   MODAL & TOAST
============================================================ */
function openModal(url, title, meta, desc) {
  document.getElementById('modalIframe').src = url + '?autoplay=1';
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMetaInfo').innerHTML = meta.split(' · ').map(m=>`<span>${m}</span>`).join('');
  document.getElementById('modalDescInfo').textContent = desc;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('modalIframe').src=''; document.body.style.overflow=''; }
function closeModalOutside(e) { if (e.target===document.getElementById('modal')) closeModal(); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

renderAll();
</script>
</body>
</html>
